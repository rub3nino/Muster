<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lists · Muster</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css?v=6">
<link rel="stylesheet" href="css/ui.css?v=6">
<link rel="stylesheet" href="css/pages.css?v=6">
<style>.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: var(--s4); }</style>
</head>
<body data-shell data-page="lists" data-title="Lists" data-title-key="nav.lists">
<div data-content>
  <header class="page-head">
    <div>
      <h1 class="page-head__title" data-i18n="ls.title">Lists</h1>
      <p class="page-head__lead" data-i18n="ls.lead">Ready for the kitchen, the drivers and the rooms. Cancelled registrations are never counted. Copy straight into WhatsApp or a sheet.</p>
    </div>
    <div class="page-head__actions"><button class="btn" type="button" onclick="print()"><span data-icon="download"></span><span data-i18n="ls.print">Print or save as PDF</span></button></div>
  </header>
  <div class="lists" id="lists"></div>
</div>

<script src="js/i18n.js?v=6"></script>
<script src="js/muster.js?v=6"></script>
<script src="js/data.js?v=6"></script>
<script>
document.addEventListener('muster:ready', () => {
  const R = Muster, esc = R.esc;
  const act = () => R.PEOPLE.filter((p) => p.status !== 'cancelled');
  const count = (arr, f) => arr.reduce((m, p) => { const k = f(p); if (k) m[k] = (m[k] || 0) + 1; return m; }, {});
  const bars = (obj, order) => { const max = Math.max(1, ...Object.values(obj)); return `<div class="bars">${(order || Object.keys(obj)).map((k) => `<div class="bar"><span>${esc(k)}</span><div class="meter meter--accent"><i style="--v:${Math.round(((obj[k] || 0) / max) * 100)}%"></i></div><b>${obj[k] || 0}</b></div>`).join('')}</div>`; };
  const people = (arr, extra) => `<ul class="timeline" style="padding-left:0">${arr.map((p) => `<li style="padding:5px 0"><span class="avatar avatar--sm" data-hue style="--h:${R.hue(p)};width:27px;height:27px">${R.initials(p)}</span><div class="timeline__text" style="padding-top:2px"><b style="font-weight:500">${esc(p.first)} ${esc(p.last)}</b> ${extra ? `<span class="small muted">· ${esc(extra(p))}</span>` : ''}</div></li>`).join('') || `<p class="small faint">${esc(R.t('board.empty', 'Nobody here'))}</p>`}</ul>`;
  function card(id, icon, k, en, n, inner, text) {
    return `<section class="card" aria-labelledby="l-${id}"><div class="card__head"><span class="rowline__icon" style="width:34px;height:34px">${R.icon(icon, 'i--sm')}</span><h2 class="card__title grow" id="l-${id}">${esc(R.t(k, en))}</h2><span class="chip chip--plain">${n}</span><button class="btn btn--ghost btn--icon btn--sm" type="button" data-copy="c-${id}" aria-label="${esc(R.t('act.copy', 'Copy'))}">${R.icon('copy')}</button></div>
      <div class="listcard__body">${inner}</div><textarea hidden id="c-${id}">${esc(text)}</textarea></section>`;
  }
  function render() {
    const a = act();
    const sh = count(a, (p) => p.shirt); const shOrder = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
    const trans = a.filter((p) => p.transport === 'need');
    const minors = a.filter((p) => p.minor);
    const allergy = a.filter((p) => p.allergies);
    const f = a.filter((p) => p.gender === 'f'), m = a.filter((p) => p.gender === 'm');
    const money = R.PACKAGES.map((pk) => { const ps = a.filter((p) => p.pkg === pk.name); const paid = ps.reduce((t, p) => t + p.paid, 0); const due = ps.reduce((t, p) => t + p.price, 0); return [pk.name, ps.length, paid, due]; });
    const cities = count(a, (p) => p.city);
    R.$('#lists').innerHTML = [
      card('shirts', 'shirt', 'ls.shirts', 'T-shirts', a.length, bars(sh, shOrder), shOrder.map((k) => `${k}: ${sh[k] || 0}`).join('\n')),
      card('allergy', 'heart', 'ls.allergy', 'Allergies & diet', allergy.length, `<div class="callout callout--warn" style="margin-bottom:10px"><span data-icon="shield"></span><div class="callout__body small">${esc(R.t('ls.health', 'Health data: share only with the kitchen team.'))}</div></div>` + people(allergy, (p) => p.allergies), allergy.map((p) => `${p.first} ${p.last}: ${p.allergies}`).join('\n')),
      card('transport', 'car', 'ls.transport', 'Needs transport', trans.length, people(trans, (p) => `${p.city} · ${p.phone}`), trans.map((p) => `${p.first} ${p.last} · ${p.city} · ${p.phone}`).join('\n')),
      card('minors', 'shield', 'ls.minors', 'Minors and parents', minors.length, people(minors, (p) => `${p.parent.name} · ${p.parent.phone}`), minors.map((p) => `${p.first} ${p.last} (${p.age}) · ${p.parent.name} ${p.parent.phone}`).join('\n')),
      card('rooms', 'bed', 'ls.rooms', 'Rooms', a.length, bars({ [R.t('g.f', 'Female')]: f.length, [R.t('g.m', 'Male')]: m.length }), `${R.t('g.f', 'Female')}: ${f.length}\n${R.t('g.m', 'Male')}: ${m.length}`),
      card('money', 'euro', 'ls.money', 'Money by package', '', `<div class="summary">${money.map(([n, c, paid, due]) => `<div class="summary__row"><span>${esc(n)} · ${c}</span><b class="num">${R.money(paid)} <span class="faint" style="font-weight:400">/ ${R.money(due)}</span></b></div>`).join('')}</div>`, money.map(([n, c, paid, due]) => `${n} (${c}): ${paid} / ${due} €`).join('\n')),
      card('cities', 'pin', 'ls.cities', 'Cities', Object.keys(cities).length, bars(cities), Object.entries(cities).map(([k, v]) => `${k}: ${v}`).join('\n')),
    ].join('');
    R.hydrateIcons(R.$('#lists'));
  }
  document.addEventListener('muster:lang', render);
  render();
});
</script>
</body>
</html>
