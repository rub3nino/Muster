<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Activity · Muster</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css?v=6">
<link rel="stylesheet" href="css/ui.css?v=6">
</head>
<body data-shell data-page="activity" data-title="Activity" data-title-key="nav.activity">
<div data-content>
  <header class="page-head">
    <div>
      <h1 class="page-head__title" data-i18n="ac.title">Activity</h1>
      <p class="page-head__lead" data-i18n="ac.lead">Who did what, and when. Entries can only be added, never edited. Server logs never contain registration details.</p>
    </div>
    <div class="page-head__actions"><button class="btn" type="button" data-toast="Backup downloaded" data-toast-key="toast.backup"><span data-icon="download"></span><span data-i18n="ac.backup">Download backup</span></button></div>
  </header>

  <div class="seg" data-seg role="tablist" id="kinds" style="margin-bottom:16px">
    <button class="seg__item" type="button" role="tab" aria-selected="true" data-value="all" data-i18n="v.all">All</button>
    <button class="seg__item" type="button" role="tab" aria-selected="false" data-value="reg" data-i18n="nav.registrations">Registrations</button>
    <button class="seg__item" type="button" role="tab" aria-selected="false" data-value="pay" data-i18n="ac.pay">Payments</button>
    <button class="seg__item" type="button" role="tab" aria-selected="false" data-value="mail" data-i18n="nav.emails">Emails</button>
    <button class="seg__item" type="button" role="tab" aria-selected="false" data-value="site" data-i18n="ac.site">Site</button>
    <button class="seg__item" type="button" role="tab" aria-selected="false" data-value="team" data-i18n="nav.team">Team</button>
  </div>

  <div class="table-wrap"><table class="table table--cards">
    <thead><tr><th data-i18n="ac.when">When</th><th data-i18n="ac.who">Who</th><th data-i18n="ac.what">What</th></tr></thead>
    <tbody id="log"></tbody>
  </table></div>
</div>

<script src="js/i18n.js?v=6"></script>
<script src="js/muster.js?v=6"></script>
<script>
document.addEventListener('muster:ready', () => {
  const R = Muster, esc = R.esc, H = 3600e3, now = Date.now();
  const L = [
    [0.2, 'Maria I.', 'pay', 'wallet', 'ac.1', 'Recorded 50 € · Revolut · Cristina Vasile (#11)'],
    [0.5, 'system', 'mail', 'timer', 'ac.2', 'Deposit reminder sent · Ana Moldovan (#4)'],
    [5, 'system', 'mail', 'alert', 'ac.3', 'Team notified: deadline passed · Ioana Stan (#5)'],
    [19, 'Radu Ene', 'reg', 'form', 'ac.4', 'Registered · Standard (#16)'],
    [41, 'Andrei P.', 'mail', 'send', 'ac.5', 'Payment details sent · Ana Moldovan (#4)'],
    [52, 'Andrei P.', 'site', 'live', 'ac.6', 'Published: Early Bird closed · countdown on · 1 notice'],
    [70, 'Andrei P.', 'reg', 'x', 'ac.7', 'Cancelled · Paul Neagu (#10) · asked to cancel'],
    [96, 'Andrei P.', 'team', 'shield', 'ac.8', 'Invited maria.i@example.com as Organiser'],
    [120, 'Andrei P.', 'team', 'download', 'ac.9', 'Downloaded a backup'],
  ];
  let kind = 'all';
  function render() {
    R.$('#log').innerHTML = L.filter((r) => kind === 'all' || r[2] === kind).map(([h, who, k, ic, key, en]) => `
      <tr><td data-label="${esc(R.t('ac.when', 'When'))}" class="small muted" style="white-space:nowrap">${R.fmtDate(new Date(now - h * H).toISOString(), 'time')}</td>
      <td data-label="${esc(R.t('ac.who', 'Who'))}"><span class="person"><span class="avatar avatar--sm" ${who === 'system' ? 'style="background:var(--surface-sunk);color:var(--ink-2)"' : `data-hue style="--h:${who.length * 40}"`}>${who === 'system' ? R.icon('sparkle', 'i--sm') : esc(who.split(' ').map((w) => w[0]).join(''))}</span>${esc(who === 'system' ? R.t('h.system', 'system') : who)}</span></td>
      <td class="cell-main"><span class="row">${R.icon(ic, 'i--sm')}<span>${esc(R.t(key, en))}</span></span></td></tr>`).join('');
  }
  R.$('#kinds').addEventListener('seg:change', (e) => { kind = e.detail; render(); });
  document.addEventListener('muster:lang', render);
  render();
});
</script>
</body>
</html>
